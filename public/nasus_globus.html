<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nasus'Nasus</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff;
    font-family: sans-serif; font-size: 14px; opacity: 0.7;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Ziehen = drehen · Scrollen = zoomen</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// === HIER DEIN BILD EINTRAGEN ===
const TEXTUR_PFAD = 'NasusInUebersichtlich.jpg';
// =================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 0, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Licht
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);

// Kugel
const geometry = new THREE.SphereGeometry(1, 96, 64);
const texture = new THREE.TextureLoader().load(TEXTUR_PFAD);
texture.colorSpace = THREE.SRGBColorSpace;

const material = new THREE.MeshStandardMaterial({
  map: texture,
  roughness: 1.0,
  metalness: 0.0
});

const globe = new THREE.Mesh(geometry, material);
scene.add(globe);

// Steuerung
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.8;
controls.minDistance = 1.3;
controls.maxDistance = 10;

// Automatische Drehung
let autoRotate = true;
renderer.domElement.addEventListener('pointerdown', () => autoRotate = false);

function animate() {
  requestAnimationFrame(animate);
  if (autoRotate) globe.rotation.y += 0.0015;
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Fenstergröße anpassen
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
